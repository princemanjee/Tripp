# Tripp TURN relay on the Mac Studio (coturn.princerehman.com).
# The public IP and the shared secret are added at start by run.sh: the IP
# because the home connection's address can change, the secret because it
# lives only in .env here and in the Edge Function's secrets.

listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200

realm=coturn.princerehman.com
server-name=coturn.princerehman.com

# Time-limited credentials only: username "<expiry>:<label>", password the
# HMAC of it under the shared secret (the TURN REST API scheme).
use-auth-secret
fingerprint
stale-nonce=600

cert=/certs/fullchain.pem
pkey=/certs/privkey.pem

# Browsers relay over UDP only.
no-tcp-relay
user-quota=4
total-quota=40

log-file=stdout
simple-log

# No open relay into private space: loopback, private, link-local, CGNAT,
# documentation, benchmarking and reserved ranges are refused as peers.
# run.sh also denies the home's own public IP.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=64:ff9b:1::-64:ff9b:1:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
